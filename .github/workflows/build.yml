name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ipa:
    name: Build unsigned .ipa (device)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust with the iOS target
        run: |
          curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/ntscbridge/target
          key: rust-ios-${{ hashFiles('rust/ntscbridge/Cargo.toml') }}

      - name: Build ntsc-rs bridge (device)
        run: |
          rustup target add aarch64-apple-ios
          cd rust/ntscbridge
          cargo build --release --target aarch64-apple-ios
          mkdir -p "$GITHUB_WORKSPACE/rust/target/aarch64-apple-ios/release"
          cp target/aarch64-apple-ios/release/libntscbridge.a              "$GITHUB_WORKSPACE/rust/target/aarch64-apple-ios/release/" 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/rust/target/aarch64-apple-ios/release/"

      # ntsc-rs's lexer mis-parses any string value in a preset and rejects the
      # whole file, which shows up as every look rendering its default rather
      # than as an error. Keep these numeric.
      - name: Check the aesthetic presets are string-free
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = []
          for path in glob.glob("aesthetic-presets/*.json"):
              if path.endswith("aesthetic-manifest.json"):
                  continue
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
              strings = [k for k, v in data.items() if isinstance(v, str)]
              if strings:
                  bad.append((path, strings))
          for path, keys in bad:
              print("::error::%s carries string values ntsc-rs will reject: %s"
                    % (path, ", ".join(keys)))
          sys.exit(1 if bad else 0)
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (device, unsigned)
        run: |
          xcodebuild build \
            -project EasyEditor.xcodeproj \
            -scheme EasyEditor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package .ipa (unsigned)
        run: |
          APP="build/Build/Products/Release-iphoneos/EasyEditor.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Built .app not found at $APP"
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload EasyEditor-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry EasyEditor-unsigned.ipa Payload
          echo "Built:" && ls -lh EasyEditor-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyEditor-unsigned-ipa
          path: EasyEditor-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
