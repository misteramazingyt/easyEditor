name: EasyEditor
options:
  bundleIdPrefix: com.easyeditor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # Compile .metal as Core Image kernels (see Apple: Build Metal-based
    # Core Image kernels with Xcode).
    MTL_COMPILER_FLAGS: "-fcikernel"
    MTLLINKER_FLAGS: "-cikernel"
    DEVELOPMENT_TEAM: "" # <-- set your Apple Developer Team ID in Xcode

targets:
  EasyEditor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EasyEditor
      - path: aesthetic-presets
        buildPhase: resources
    info:
      path: EasyEditor/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts: [TikTokSans.ttf]
        NSCameraUsageDescription: "EasyEditor uses the camera to record you over your timeline with the background removed."
        NSMicrophoneUsageDescription: "EasyEditor needs microphone access to record voiceovers and camera takes."
        NSPhotoLibraryAddUsageDescription: "EasyEditor needs permission to save exported videos to your Photos library."
        NSSpeechRecognitionUsageDescription: "EasyEditor uses speech recognition to generate automatic captions from your clips."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # The desktop-library server speaks plain HTTP over the tailnet
        # (WireGuard-encrypted underneath); ATS must allow it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Receive GreenDeck project packages (.gdproj) via the share sheet.
        # No LSSupportsOpeningDocumentsInPlace on purpose: the system copies
        # into Documents/Inbox and we consume + delete.
        CFBundleDocumentTypes:
          - CFBundleTypeName: GreenDeck Project
            LSHandlerRank: Owner
            LSItemContentTypes: [com.greendeck.project]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.greendeck.project
            UTTypeDescription: GreenDeck Project
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gdproj]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easyeditor.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES

schemes:
  EasyEditor:
    build:
      targets:
        EasyEditor: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
